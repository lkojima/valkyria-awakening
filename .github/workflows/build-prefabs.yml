name: Generate Prefabs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-prefabs:
    name: Generate Prefabs (Unity 2022.3 LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      UNITY_VERSION: 2022.3.40f1
      UNITY_URL: https://download.unity3d.com/download_unity/6d7c8f3b5c8f/LinuxEditorInstaller/UnitySetup64-2022.3.40f1
      # Hashes from https://unity.com/releases/editor/whats-new/2022.3.40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: UnityProject/Library
          key: unity-library-${{ hashFiles('UnityProject/Packages/manifest.json', 'UnityProject/Packages/packages-lock.json') }}
          restore-keys: |
            unity-library-

      # Instala Unity manualmente (sempre funciona)
      - name: Install Unity
        run: |
          set -euo pipefail
          echo "Downloading Unity ${{ env.UNITY_VERSION }}..."
          wget -q -O unity.deb "${{ env.UNITY_URL }}"
          echo "Installing Unity..."
          sudo dpkg -i unity.deb || sudo apt-get install -f -y
          # Verify
          /opt/unity/editor/Unity -version

      # Gera prefabs
      - name: Generate Prefabs
        run: |
          /opt/unity/editor/Unity \
            -batchmode \
            -projectPath UnityProject \
            -executeMethod PrefabGenerator.GenerateAll \
            -quit \
            -logFile - \
            -nographics

      - name: Upload Prefabs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prefabs
          path: UnityProject/Assets/Prefabs/
          retention-days: 7
          if-no-files-found: warn

      - name: Commit Generated Prefabs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd UnityProject
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Assets/Prefabs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-generate prefabs [skip ci]"
            git push
          else
            echo "Nenhuma mudança nos prefabs"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}