name: Generate Prefabs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-prefabs:
    name: Generate Prefabs (Unity 2022.3 LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: UnityProject/Library
          key: unity-library-${{ hashFiles('UnityProject/Packages/manifest.json', 'UnityProject/Packages/packages-lock.json') }}
          restore-keys: |
            unity-library-

      # Instala Unity - usa versão estável disponível no game-ci
      - name: Install Unity
        uses: game-ci/unity-installer@v4
        with:
          unityVersion: 2022.3.40f1
          cacheKey: unity-${{ hashFiles('UnityProject/Packages/manifest.json') }}

      # Gera prefabs - Personal license ativa automaticamente (sem UNITY_LICENSE)
      - name: Generate Prefabs
        uses: game-ci/unity-builder@v4
        with:
          projectPath: UnityProject
          customParameters: -batchmode -executeMethod PrefabGenerator.GenerateAll -quit -logFile -

      - name: Upload Prefabs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prefabs
          path: UnityProject/Assets/Prefabs/
          retention-days: 7
          if-no-files-found: warn

      # Commit automático dos prefabs (opcional)
      - name: Commit Generated Prefabs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd UnityProject
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Assets/Prefabs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-generate prefabs [skip ci]"
            git push
          else
            echo "Nenhuma mudança nos prefabs"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}