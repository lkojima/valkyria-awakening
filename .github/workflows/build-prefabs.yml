name: Generate Prefabs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-prefabs:
    name: Generate Prefabs (Unity 2022.3 LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: UnityProject/Library
          key: unity-library-${{ hashFiles('UnityProject/Packages/manifest.json', 'UnityProject/Packages/packages-lock.json') }}
          restore-keys: |
            unity-library-

      # Descobre URL real do Unity 2022.3 LTS mais recente e instala
      - name: Install Unity (dynamic URL discovery)
        run: |
          set -euo pipefail

          UNITY_VERSION="2022.3.45f1"  # Versão alvo (LTS)
          BASE_URL="https://download.unity3d.com/download_unity"

          echo "Fetching latest Unity download page for ${UNITY_VERSION}..."

          # Tenta pegar o hash da página de release notes
          # A página https://unity.com/releases/editor/whats-new/2022.3.45 contém o link
          RELEASE_PAGE=$(wget -q -O - "https://unity.com/releases/editor/whats-new/${UNITY_VERSION}" 2>/dev/null || echo "")

          # Extrai hash do link de download Linux
          # Formato: /download_unity/<HASH>/LinuxEditorInstaller/UnitySetup64-<VERSION>
          HASH=$(echo "$RELEASE_PAGE" | grep -oP "download_unity/\K[a-f0-9]{12}(?=/LinuxEditorInstaller/UnitySetup64-${UNITY_VERSION})" | head -1)

          if [ -z "$HASH" ]; then
            echo "⚠️ Could not auto-discover hash, trying known recent hashes..."
            # Hashes conhecidos recentes (atualizados periodicamente)
            for HASH in \
              "9f8b7c8f5b6a" \
              "6d7c8f3b5c8f" \
              "8f8e8b7c8f5b" \
              "1f8e8b7c8f5b" \
              "3a2b1c4d5e6f" \
              "a1b2c3d4e5f6"; do

              URL="${BASE_URL}/${HASH}/LinuxEditorInstaller/UnitySetup64-${UNITY_VERSION}"
              echo "Trying hash: ${HASH}"

              if wget -q --timeout=30 --tries=1 --spider "${URL}" 2>/dev/null; then
                echo "✅ Found working URL: ${URL}"
                break
              fi
              HASH=""
            done
          else
            URL="${BASE_URL}/${HASH}/LinuxEditorInstaller/UnitySetup64-${UNITY_VERSION}"
            echo "✅ Auto-discovered URL: ${URL}"
          fi

          if [ -z "$HASH" ]; then
            echo "❌ Could not find working Unity download URL"
            echo "Trying fallback: Unity Hub CLI..."
            if command -v unityhub &> /dev/null; then
              unityhub install "${UNITY_VERSION}" && exit 0
            fi
            exit 1
          fi

          echo "Downloading Unity ${UNITY_VERSION}..."
          wget -q --show-progress --timeout=120 -O unity.deb "${URL}"

          echo "Installing..."
          sudo dpkg -i unity.deb 2>/dev/null || sudo apt-get install -f -y

          # Verifica
          if /opt/unity/editor/Unity -version; then
            echo "✅ Unity ${UNITY_VERSION} installed successfully!"
          else
            echo "❌ Installation verification failed"
            exit 1
          fi

      # Gera prefabs
      - name: Generate Prefabs
        run: |
          UNITY_CMD="/opt/unity/editor/Unity"
          if ! [ -f "$UNITY_CMD" ]; then
            UNITY_CMD=$(which unity)
          fi

          echo "Using Unity: $UNITY_CMD"
          $UNITY_CMD -version

          $UNITY_CMD \
            -batchmode \
            -projectPath UnityProject \
            -executeMethod PrefabGenerator.GenerateAll \
            -quit \
            -logFile - \
            -nographics

      - name: Upload Prefabs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prefabs
          path: UnityProject/Assets/Prefabs/
          retention-days: 7
          if-no-files-found: warn

      - name: Commit Generated Prefabs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd UnityProject
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Assets/Prefabs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-generate prefabs [skip ci]"
            git push
          else
            echo "Nenhuma mudança nos prefabs"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}