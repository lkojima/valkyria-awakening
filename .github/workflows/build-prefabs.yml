name: Generate Prefabs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-prefabs:
    name: Generate Prefabs (Unity 2022.3 LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: UnityProject/Library
          key: unity-library-${{ hashFiles('UnityProject/Packages/manifest.json', 'UnityProject/Packages/packages-lock.json') }}
          restore-keys: |
            unity-library-

      # Setup Unity usando action oficial (não precisa de game-ci)
      - name: Setup Unity
        uses: unity-actions/setup-unity@v2
        with:
          unity-version: 2022.3.40f1
          cache-key: unity-${{ hashFiles('UnityProject/Packages/manifest.json') }}

      # Gera prefabs - Personal license ativa automaticamente
      - name: Generate Prefabs
        run: |
          /opt/unity/editor/Unity \
            -batchmode \
            -projectPath UnityProject \
            -executeMethod PrefabGenerator.GenerateAll \
            -quit \
            -logFile - \
            -nographics

      - name: Upload Prefabs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prefabs
          path: UnityProject/Assets/Prefabs/
          retention-days: 7
          if-no-files-found: warn

      - name: Commit Generated Prefabs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd UnityProject
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Assets/Prefabs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-generate prefabs [skip ci]"
            git push
          else
            echo "Nenhuma mudança nos prefabs"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}